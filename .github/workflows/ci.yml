name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest --cov=costcompose --cov-report=term-missing

  full:
    # Optional dependencies installed: LangGraph engine parity, real Redis backend, CLI smoke run.
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,all]"
      - run: pytest
      - run: costcompose validate --tasks data/tasks/sample.jsonl --configs baseline cache_only route_only composed configs/ablations/*.yaml
      - run: costcompose run --dry-run --engine langgraph --cache-backend redis --tasks data/tasks/sample.jsonl --corpus data/corpus --seeds 0 1 --out /tmp/results
        env:
          COSTCOMPOSE_REDIS_URL: redis://localhost:6379/0
      - uses: actions/upload-artifact@v4
        with:
          name: dry-run-results
          path: /tmp/results
