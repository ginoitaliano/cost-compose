# Reference point: every request goes to one model, the top rung of the routing ladder. With baseline
# (GPT-4o for every request) these give each model's cost and success on the same tasks, and the
# task-level oracle: the cheapest of these models that solves each task.
extends: ../base.yaml
name: sonnet_only
routing: {default_model: anthropic/claude-sonnet-4-5}
